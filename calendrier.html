<style>

      '<div class="txt"><div class="title"><span class="strike' + (ev.completed ? " on" : "") + '">' + esc(ev.title) + '</span>' + (ev.completed ? '<span class="sr"> (fait)</span>' : "") + '</div>' +
      '<div class="meta">' + (showDate && ev.time ? "<span>" + esc(ev.time) + "</span>" : "") + (ev.location ? "<span>" + I.pin + " " + esc(ev.location) + "</span>" : "") + '<span class="sr">Catégorie ' + esc(c.label) + '.</span></div></div>' +
      (total ? '<span class="pill' + (done === total ? " ready" : "") + '">' + I.list + '<span class="sr">Liste :</span>' + done + "/" + total + "</span>" : "") +

  }

  // ---------- views ----------
  var calMonth = (function () { var t = today(); return new Date(t.getFullYear(), t.getMonth(), 1); })();
  var calSel = key(today());
  var doneOpen = true;

  function viewList() {
    var all = sorted(data.events);

    var h = '<section aria-labelledby="t1"><div class="row-between"><h1 id="t1" tabindex="-1" class="focus-target">À faire <span class="count">(' + todo.length + ')</span></h1>' +
      '<a class="btn" href="#/calendrier">' + I.cal + ' Calendrier</a></div>';

    h += "</section>";
    if (done.length) {
      h += '<details class="done section" id="faits"' + (doneOpen ? " open" : "") + '><summary><h2>Faits <span class="count">(' + done.length + ')</span></h2>' + I.down + '</summary>' +
        '<ul class="events">' + done.map(function (e) { return rowHTML(e, true); }).join("") + "</ul></details>";

  function viewCalendar() {
    var t = today(), tk = key(t);
    var first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
    var start = addDays(first, -((first.getDay() + 6) % 7));
    var last = new Date(calMonth.getFullYear(), calMonth.getMonth() + 1, 0);
    var end = addDays(last, (7 - last.getDay()) % 7);
    var byDay = {};
    sorted(data.events).forEach(function (e) { (byDay[e.date] = byDay[e.date] || []).push(e); });
    var cells = "";
    for (var d = start; d <= end; d = addDays(d, 1)) {
      var k = key(d), evs = byDay[k] || [], cls = "day";
      if (d.getMonth() !== calMonth.getMonth()) cls += " out";
      if (k === tk) cls += " today";
      var label = longDate(d) + (evs.length ? ", " + evs.length + " événement" + (evs.length > 1 ? "s" : "") : "");
      cells += '<li><button type="button" class="' + cls + '" data-act="day" data-day="' + k + '" aria-pressed="' + (k === calSel) + '"' + (k === tk ? ' aria-current="date"' : "") + ' aria-label="' + label + '"><span class="n">' + d.getDate() + '</span>' +
        (evs.length ? '<span class="dots" aria-hidden="true">' + evs.slice(0, 3).map(function (e) { return '<span style="background:' + catColor(e.category) + '"></span>'; }).join("") + "</span>" : "") + "</button></li>";
    }
    var dayEvs = byDay[calSel] || [];
    var upcoming = sorted(data.events).filter(function (e) { return !e.completed && parse(e.date) >= t && e.date !== calSel; }).slice(0, 6);
    var h = '<section aria-labelledby="t1"><div class="row-between"><h1 id="t1" tabindex="-1" aria-live="polite" style="font-size:1.1rem;flex-shrink:0;overflow:visible">' + cap(MONTHS[calMonth.getMonth()]) + " " + calMonth.getFullYear() + '</h1><div>' +
      '<button type="button" class="btn ghost" data-act="today" style="padding:8px 4px;font-size:.85rem">Aujourd\u2019hui</button>' +
      '<button type="button" class="btn ghost icon" style="width:36px" data-act="prev" aria-label="Mois précédent">' + I.left + '</button>' +
      '<button type="button" class="btn ghost icon" style="width:36px" data-act="next" aria-label="Mois suivant">' + I.right + '</button></div></div>' +
      '<div class="cal"><div class="wd" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><ul aria-label="Jours du mois">' + cells + '</ul>' +
      '<ul class="legend" aria-label="Légende des catégories">' + data.categories.map(function (c) { return '<li><i style="background:' + colorOf(c.color).c + '"></i>' + esc(c.label) + "</li>"; }).join("") + "</ul></div></section>";
    h += '<section class="section" aria-labelledby="t2"><div class="row-between"><h2 id="t2">' + cap(longDate(parse(calSel))) + '</h2><button type="button" class="btn" data-act="new">' + I.plus + " Ajouter</button></div>";
    h += dayEvs.length ? '<ul class="events">' + dayEvs.map(function (e) { return rowHTML(e, false); }).join("") + "</ul>" : '<p class="empty">Aucun événement ce jour-là.</p>';
    h += '</section><section class="section" aria-labelledby="t3"><h2 id="t3">À venir</h2>';
    h += upcoming.length ? '<ul class="events">' + upcoming.map(function (e) { return rowHTML(e, true); }).join("") + "</ul>" : '<p class="empty">Rien d\u2019autre à venir.</p>';
    h += "</section>" + storageNote();
    return h;
  }

  function relLabel(date) {
    var diff = Math.round((parse(date) - today()) / 86400000);
    if (diff === 0) return "Aujourd\u2019hui"; if (diff === 1) return "Demain"; if (diff < 0) return "Passé";
    return "Dans " + diff + " jours";
  }

  function viewEvent(id) {
    var ev = findEv(id);

    var d = parse(ev.date), c = cat(ev.category);
    var done = ev.items.filter(function (i) { return i.done; }).length, total = ev.items.length, pct = total ? Math.round(done / total * 100) : 0;
    var h = '<div class="row-between"><a class="btn ghost" href="#/">' + I.back + ' Liste</a><div>' +
      '<button type="button" class="btn ghost icon" data-act="dup" aria-label="Dupliquer l\u2019événement">' + I.copy + '</button>' +
      '<button type="button" class="btn ghost icon" data-act="edit" aria-label="Modifier l\u2019événement">' + I.edit + '</button>' +
      '<button type="button" class="btn ghost icon danger" data-act="delete" aria-label="Supprimer l\u2019événement">' + I.trash + '</button></div></div>';
    h += '<div class="evhead"><div class="bigdate" style="background:' + catColor(ev.category) + '"><div class="m">' + MONTHS_S[d.getMonth()] + '</div><div class="d">' + d.getDate() + '</div><div class="w">' + DAYS_S[d.getDay()] + '</div></div><div style="min-width:0">' +
      '<h1 id="t1" tabindex="-1" style="margin:0">' + esc(ev.title) + '</h1><div class="tags"><span class="tag" style="background:' + catColor(ev.category) + '">' + esc(c.label) + '</span><span class="tag neutral">' + relLabel(ev.date) + '</span></div>' +
      '<dl class="info">' + (ev.time ? "<div><dt>" + I.clock + '<span class="sr">Heure</span></dt><dd>' + esc(ev.time) + "</dd></div>" : "") +
      (ev.location ? "<div><dt>" + I.pin + '<span class="sr">Lieu</span></dt><dd>' + esc(ev.location) + "</dd></div>" : "") + "</dl></div></div>";
    h += '<div class="donebox"><input type="checkbox" class="chk" id="ev-fait" data-act="complete-page"' + (ev.completed ? " checked" : "") + '><label for="ev-fait">Fait</label>' + (ev.completed ? '<span class="badge-done">Complété</span>' : "") + "</div>";
    if (ev.notes) h += '<p class="notes">' + esc(ev.notes) + "</p>";
    h += '<section class="section" aria-labelledby="t2"><div class="row-between"><h2 id="t2">Liste</h2><span class="small" aria-live="polite">' + (total ? done + " sur " + total + " prêt" + (done > 1 ? "s" : "") : "Liste vide") + "</span></div>";
    if (total) h += '<div class="progress" role="progressbar" aria-label="Liste complétée" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div style="width:' + pct + '%"></div></div>';
    h += '<ul class="items">' + ev.items.map(function (it) {
      return '<li><input type="checkbox" class="chk" id="it-' + esc(it.id) + '" data-act="item" data-item="' + esc(it.id) + '"' + (it.done ? " checked" : "") + '><label for="it-' + esc(it.id) + '"><span class="strike' + (it.done ? " on" : "") + '">' + esc(it.label) + '</span></label>' +
        '<button type="button" class="btn ghost icon" data-act="rmitem" data-item="' + esc(it.id) + '" aria-label="Retirer ' + esc(it.label) + '">' + I.x + "</button></li>";
    }).join("") + '<li class="addrow"><form id="additem" style="display:flex;gap:8px;width:100%"><label for="newitem" class="sr">Nouvel élément</label><input type="text" id="newitem" placeholder="Ajouter un élément…" autocomplete="off" enterkeyhint="done"><button type="submit" class="btn primary icon" aria-label="Ajouter à la liste">' + I.plus + "</button></form></li></ul>";
    h += '<p class="err" id="itemerr" role="alert"></p></section>' + storageNote();
    return h;
  }

  function viewCategories() {
    var h = '<h1 id="t1" tabindex="-1">Catégories</h1><ul class="cats">' + data.categories.map(function (c) {
      var n = data.events.filter(function (e) { return e.category === c.id; }).length;
      return '<li><button type="button" class="swatch-btn" data-act="pickcolor" data-cat="' + esc(c.id) + '" aria-label="Couleur de ' + esc(c.label) + " : " + colorOf(c.color).n + '"><i style="background:' + colorOf(c.color).c + '"></i></button>' +
        '<form data-cat="' + esc(c.id) + '" class="catform" style="flex:1;min-width:0"><label class="sr" for="cn-' + esc(c.id) + '">Nom de la catégorie</label><input type="text" id="cn-' + esc(c.id) + '" value="' + esc(c.label) + '" data-cat="' + esc(c.id) + '" class="catname" enterkeyhint="done"></form>' +
        '<span class="small" style="width:52px;text-align:end">' + n + ' évén.</span><button type="button" class="btn ghost icon danger" data-act="rmcat" data-cat="' + esc(c.id) + '" aria-label="Supprimer ' + esc(c.label) + '">' + I.trash + "</button></li>";
    }).join("") + "</ul>";
    if (!data.categories.length) h += '<p class="empty">Aucune catégorie.</p>';
    h += '<form id="addcat" class="card section"><h2 style="margin-bottom:8px">Nouvelle catégorie</h2><div style="display:flex;gap:8px;align-items:center">' +
      '<button type="button" class="swatch-btn" data-act="pickcolor" data-cat="__new" aria-label="Couleur : ' + colorOf(newCatColor).n + '"><i style="background:' + colorOf(newCatColor).c + '"></i></button>' +
      '<label class="sr" for="newcat">Nom</label><input type="text" id="newcat" placeholder="Ex. : Camping" autocomplete="off"><button type="submit" class="btn primary">' + I.plus + ' Ajouter</button></div><p class="err" id="caterr" role="alert"></p></form>';
    return h + storageNote();
  }
  var newCatColor = "violet";

  // ---------- render + FLIP ----------
  var app = document.getElementById("app");
  function route() { var h = location.hash.replace(/^#/, "") || "/"; return h; }
  function render(opts) {
    var r = route(), html, nav = "liste";
    var before = {};
    if (opts && opts.flip) app.querySelectorAll("ul.events > li[data-id]").forEach(function (li) { before[li.dataset.id] = li.getBoundingClientRect().top; });
    if (r.indexOf("/evenement/") === 0) { html = viewEvent(decodeURIComponent(r.slice(11))); nav = ""; }
    else if (r === "/calendrier") { html = viewCalendar(); nav = "calendrier"; }
    else if (r === "/categories") { html = viewCategories(); nav = "categories"; }
    else html = viewList();
    app.innerHTML = html;
    document.querySelectorAll("[data-nav]").forEach(function (a) { if (a.dataset.nav === nav) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    var fd = document.getElementById("faits");
    if (fd) fd.addEventListener("toggle", function () { doneOpen = fd.open; });
    if (opts && opts.flip && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      app.querySelectorAll("ul.events > li[data-id]").forEach(function (li) {
        var old = before[li.dataset.id], now = li.getBoundingClientRect().top;
        if (old == null) { li.animate([{ opacity: 0, transform: "translateY(-8px)" }, { opacity: 1, transform: "none" }], { duration: 250, easing: "ease-out" }); return; }
        var dy = old - now;
        if (Math.abs(dy) > 1) li.animate([{ transform: "translateY(" + dy + "px)" }, { transform: "none" }], { duration: 380, easing: "cubic-bezier(.2,.8,.2,1)" });
      });
    }
  }
  window.addEventListener("hashchange", function () {
    render(); window.scrollTo(0, 0);
    var t = document.getElementById("t1"); if (t) t.focus({ preventScroll: true });
  });

  // ---------- event form dialog ----------
  var dlg = document.getElementById("dlg");
  function openDialog(html, onSubmit, focusSel) {
    dlg.innerHTML = html;
    var f = dlg.querySelector("form");
    f.addEventListener("submit", function (e) { e.preventDefault(); onSubmit(f); });
    dlg.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", function () { dlg.close(); }); });
    dlg.showModal();
    var el = focusSel && dlg.querySelector(focusSel); if (el) el.focus();
  }
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });

  function eventForm(ev, defaultDate) {
    var e = ev || { title: "", date: defaultDate || key(today()), time: "", location: "", notes: "", category: data.categories.length ? data.categories[0].id : "" };
    var opts = data.categories.map(function (c) { return '<option value="' + esc(c.id) + '"' + (c.id === e.category ? " selected" : "") + ">" + esc(c.label) + "</option>"; }).join("") +
      '<option value=""' + (!cat(e.category).id ? " selected" : "") + ">Sans catégorie</option>";
    openDialog('<form novalidate><h2 id="dlg-title">' + (ev ? "Modifier l\u2019événement" : "Nouvel événement") + '</h2>' +
      '<div class="field"><label for="f-title">Titre</label><input type="text" id="f-title" name="title" value="' + esc(e.title) + '" aria-describedby="f-err"><p class="err" id="f-err" role="alert"></p></div>' +
      '<div class="two"><div class="field"><label for="f-date">Date</label><input type="date" id="f-date" name="date" value="' + esc(e.date) + '" required></div>' +
      '<div class="field"><label for="f-time">Heure</label><input type="time" id="f-time" name="time" value="' + esc(e.time) + '"></div></div>' +
      '<div class="field"><label for="f-loc">Lieu</label><input type="text" id="f-loc" name="location" value="' + esc(e.location) + '"></div>' +
      '<div class="field"><label for="f-cat">Catégorie</label><select id="f-cat" name="category">' + opts + "</select></div>" +
      '<div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" rows="3">' + esc(e.notes) + "</textarea></div>" +
      '<div class="actions"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></div></form>',
      function (f) {
        var title = f.title.value.trim();
        if (!title) { document.getElementById("f-err").textContent = "Le titre est obligatoire."; f.title.focus(); return; }
        if (!f.date.value) { document.getElementById("f-err").textContent = "Choisissez une date."; f.date.focus(); return; }
        var vals = { title: title, date: f.date.value, time: f.time.value, location: f.location.value.trim(), notes: f.notes.value.trim(), category: f.category.value };
        if (ev) Object.assign(ev, vals);
        else data.events.push(Object.assign({ id: uid(), completed: false, items: [] }, vals));
        save(); dlg.close(); render(); toast(ev ? "Événement modifié" : "Événement ajouté");
      }, "#f-title");
  }

  function dupForm(ev) {
    var nw = addDays(parse(ev.date), 7);
    openDialog('<form><h2 id="dlg-title">Dupliquer l\u2019événement</h2><p class="small" style="margin:0">La liste sera copiée, avec tous les éléments décochés.</p>' +
      '<button type="button" class="btn primary" id="dup-week" style="justify-content:center">Semaine prochaine · ' + longDate(nw) + '</button>' +
      '<div class="field"><label for="dup-date">Ou choisir une date</label><input type="date" id="dup-date" name="dupdate"></div><p class="err" id="dup-err" role="alert"></p>' +
      '<div class="actions"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn">Dupliquer à cette date</button></div></form>',
      function (f) {
        if (!f.dupdate.value) { document.getElementById("dup-err").textContent = "Choisissez une date."; f.dupdate.focus(); return; }
        doDup(ev, f.dupdate.value);
      });
    document.getElementById("dup-week").addEventListener("click", function () { doDup(ev, key(nw)); });
  }
  function doDup(ev, date) {
    var copy = JSON.parse(JSON.stringify(ev));
    copy.id = uid(); copy.date = date; copy.completed = false;
    copy.items = copy.items.map(function (i) { return { id: uid(), label: i.label, done: false }; });
    data.events.push(copy); save(); dlg.close();
    toast("Dupliqué au " + longDate(parse(date)));
    location.hash = "#/evenement/" + encodeURIComponent(copy.id);
  }

  function confirmDialog(title, desc, okLabel, onOk) {
    openDialog('<form><h2 id="dlg-title">' + esc(title) + "</h2>" + (desc ? '<p style="margin:0">' + esc(desc) + "</p>" : "") +
      '<div class="actions"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary" style="background:var(--danger);border-color:var(--danger)">' + esc(okLabel) + "</button></div></form>",
      function () { dlg.close(); onOk(); });
  }

  function colorDialog(catId) {
    var cur = catId === "__new" ? newCatColor : cat(catId).color;
    openDialog('<form><h2 id="dlg-title">Choisir une couleur</h2><div class="swatches" role="group" aria-label="Couleurs">' + COLORS.map(function (c) {
      return '<button type="button" data-color="' + c.k + '" aria-label="' + c.n + '" aria-pressed="' + (c.k === cur) + '" style="background:' + c.c + '">' + (c.k === cur ? I.check : "") + "</button>";
    }).join("") + '</div><div class="actions"><button type="button" class="btn" data-close>Fermer</button></div></form>', function () {});
    dlg.querySelectorAll("[data-color]").forEach(function (b) {

  // ---------- interactions ----------
  function currentEvent() { var r = route(); return r.indexOf("/evenement/") === 0 ? findEv(decodeURIComponent(r.slice(11))) : null; }

  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var act = t.dataset.act, ev = currentEvent();
    if (act === "new") eventForm(null, route() === "/calendrier" ? calSel : null);
    else if (act === "day") { calSel = t.dataset.day; var d = parse(calSel); calMonth = new Date(d.getFullYear(), d.getMonth(), 1); render(); var b = app.querySelector('[data-day="' + calSel + '"]'); if (b) b.focus(); }
    else if (act === "prev" || act === "next") { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + (act === "prev" ? -1 : 1), 1); render(); app.querySelector('[data-act="' + act + '"]').focus(); }
    else if (act === "today") { var tt = today(); calMonth = new Date(tt.getFullYear(), tt.getMonth(), 1); calSel = key(tt); render(); }
    else if (act === "edit" && ev) eventForm(ev);
    else if (act === "dup" && ev) dupForm(ev);
    else if (act === "delete" && ev) confirmDialog("Supprimer cet événement?", "L\u2019événement et sa liste seront supprimés.", "Supprimer", function () {
      data.events = data.events.filter(function (x) { return x.id !== ev.id; }); save(); location.hash = "#/"; toast("Événement supprimé");
    });
    else if (act === "rmitem" && ev) { ev.items = ev.items.filter(function (i) { return i.id !== t.dataset.item; }); save(); render(); }
    else if (act === "pickcolor") colorDialog(t.dataset.cat);
    else if (act === "rmcat") {
      var c = cat(t.dataset.cat), n = data.events.filter(function (x) { return x.category === c.id; }).length;
      confirmDialog("Supprimer « " + c.label + " »?", n ? n + " événement" + (n > 1 ? "s passeront" : " passera") + " à « Sans catégorie »." : "", "Supprimer", function () {
        data.categories = data.categories.filter(function (x) { return x.id !== c.id; });
        data.events.forEach(function (x) { if (x.category === c.id) x.category = ""; });
        save(); render();
      });
    }
  });

  var pending = {};
  app.addEventListener("change", function (e) {
    var t = e.target, act = t.dataset && t.dataset.act, ev = currentEvent();
    if (act === "complete") {
      var id = t.dataset.id, target = findEv(id), on = t.checked;
      var s = t.closest("li").querySelector(".strike"); if (s) s.classList.toggle("on", on);
      clearTimeout(pending[id]);
      pending[id] = setTimeout(function () {
        if (!target) return; target.completed = on; save(); render({ flip: true });
        announce(target.title + (on ? " : fait" : " : à faire"));
      }, 380);
    } else if (act === "complete-page" && ev) {
      ev.completed = t.checked; save(); render(); document.getElementById("ev-fait").focus();
    } else if (act === "item" && ev) {
      var it = ev.items.filter(function (i) { return i.id === t.dataset.item; })[0];
      if (it) {
        it.done = t.checked; save();
        var st = t.parentNode.querySelector(".strike"); if (st) st.classList.toggle("on", it.done);
        setTimeout(function () { render(); var el = document.getElementById(t.id); if (el) el.focus(); }, 260);
      }
    } else if (t.classList && t.classList.contains("catname")) commitCat(t);
  });

  function commitCat(input) {
    var c = cat(input.dataset.cat), v = input.value.trim();
    if (!v) { input.value = c.label; return; }
    if (v !== c.label) { c.label = v; save(); }
  }

  app.addEventListener("submit", function (e) {
    var f = e.target; e.preventDefault();
    var ev = currentEvent();

      var inp = document.getElementById("newitem"), v = inp.value.trim();
      if (!v) { document.getElementById("itemerr").textContent = "Écrivez quelque chose à ajouter."; inp.focus(); return; }
      ev.items.push({ id: uid(), label: v, done: false }); save(); render();
      var ni = document.getElementById("newitem"); if (ni) ni.focus();
    } else if (f.id === "addcat") {
      var ci = document.getElementById("newcat"), cv = ci.value.trim();
      if (!cv) { document.getElementById("caterr").textContent = "Donnez un nom à la catégorie."; ci.focus(); return; }
      data.categories.push({ id: uid(), label: cv, color: newCatColor }); save(); render(); toast("Catégorie ajoutée");
    } else if (f.classList.contains("catform")) {
      var input = f.querySelector("input"); commitCat(input); input.blur();
    }
  });

  document.querySelectorAll("a[data-href]").forEach(function (a) { a.setAttribute("href", a.dataset.href); });
  render();
})();
</script>
</body>
</html>
